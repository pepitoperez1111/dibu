/* === ESTILOS PARA FRASES FUGACES MULTIDIRECCIONALES === */
.shooting-texts-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 1; /* Detrás de la flor (10) y la carta (20) */
  overflow: hidden;
}

.shooting-text {
  position: absolute;
  color: rgba(255, 235, 205, 0.9);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 1.3rem;
  font-style: italic;
  font-weight: 300;
  white-space: nowrap;
  letter-spacing: 2px;
  text-shadow: 
    0 0 8px rgba(255, 223, 137, 0.8),
    0 0 15px rgba(255, 195, 0, 0.5);
  filter: blur(1.2px);
  opacity: 0;
  animation: shootTextDynamic 6s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
}

@keyframes shootTextDynamic {
  0% {
    opacity: 0;
    transform: translate(0, 0) rotate(var(--rot, 0deg)) scale(0.7);
    filter: blur(3px);
  }
  15% {
    opacity: 0.95;
    filter: blur(0.8px);
  }
  70% {
    opacity: 0.7;
    filter: blur(1.5px);
  }
  100% {
    opacity: 0;
    transform: translate(var(--dx, 20vw), var(--dy, 20vh)) rotate(var(--rot, 0deg)) scale(1.1);
    filter: blur(4px);
  }
}

/* === SCRIPT MEJORADO PARA DIVERSAS DIRECCIONES Y BORDES === */
document.addEventListener('DOMContentLoaded', () => {
  const container = document.getElementById('shooting-texts');
  const phrases = [
    "Todo estará bien",
    "Preciosa",
    "Hermosa",
    "Te quiero mucho",
    "Te quiero",
    "Mi amor",
    "Siempre juntos",
    "Eres mi sol",
    "Nunca cambies"
  ];

  function createShootingText() {
    const el = document.createElement('div');
    el.classList.add('shooting-text');
    el.innerText = phrases[Math.floor(Math.random() * phrases.length)];

    // Selección aleatoria del origen (0: Arriba, 1: Derecha, 2: Abajo, 3: Izquierda)
    const side = Math.floor(Math.random() * 4);
    let startX, startY, dx, dy, rot;

    switch (side) {
      case 0: // Desde arriba hacia abajo-izquierda/derecha
        startX = Math.random() * 80 + 10;
        startY = -5;
        dx = (Math.random() - 0.5) * 60;
        dy = Math.random() * 50 + 40;
        rot = (Math.random() - 0.5) * 40 - 15;
        break;
      case 1: // Desde la derecha hacia la izquierda
        startX = 105;
        startY = Math.random() * 80 + 10;
        dx = -(Math.random() * 50 + 40);
        dy = (Math.random() - 0.5) * 60;
        rot = (Math.random() - 0.5) * 40 - 20;
        break;
      case 2: // Desde abajo hacia arriba
        startX = Math.random() * 80 + 10;
        startY = 105;
        dx = (Math.random() - 0.5) * 60;
        dy = -(Math.random() * 50 + 40);
        rot = (Math.random() - 0.5) * 40 + 15;
        break;
      case 3: // Desde la izquierda hacia la derecha
        startX = -15;
        startY = Math.random() * 80 + 10;
        dx = Math.random() * 50 + 40;
        dy = (Math.random() - 0.5) * 60;
        rot = (Math.random() - 0.5) * 40 + 20;
        break;
    }

    el.style.left = startX + 'vw';
    el.style.top = startY + 'vh';
    el.style.setProperty('--dx', dx + 'vw');
    el.style.setProperty('--dy', dy + 'vh');
    el.style.setProperty('--rot', rot + 'deg');

    const duration = Math.random() * 3 + 4.5; // Duración de 4.5s a 7.5s
    el.style.animationDuration = duration + 's';

    container.appendChild(el);

    setTimeout(() => {
      el.remove();
    }, duration * 1000);
  }

  createShootingText();
  setInterval(createShootingText, 1500);
});
</script>
